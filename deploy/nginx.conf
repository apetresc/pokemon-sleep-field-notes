server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        return 302 /pokemon-sleep/;
    }

    # Only the sanitized exports are read from the persistent bind mount.
    location ~ ^/pokemon-sleep/(roster|inventory|history)\.json$ {
        alias /data/$1.json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ "^/pokemon-sleep/snapshots/([0-9]{4}-[0-9]{2}-[0-9]{2}-[a-f0-9]{12}\.json)$" {
        alias /data/snapshots/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /pokemon-sleep/snapshots/ {
        return 404;
    }
    location ~ (^|/)\. {
        return 404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
